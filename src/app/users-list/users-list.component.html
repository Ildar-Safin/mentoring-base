<div class="users">
  <div *ngFor="let user of users$ | async">
    <app-user-card
      [user]="user"
      (deleteUser)="deleteUser($event)"
      (editUser)="editUser($event)">
    </app-user-card>
  </div>
</div>
<button mat-fab color="primary" class="button" (click)=openDialog()><mat-icon>add</mat-icon>
</button>
